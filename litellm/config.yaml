name: LiteLLM
version: "1.0.2"
slug: litellm
description: Configurable LiteLLM AI Gateway
url: https://github.com/rosch100/haos-litellm
image: ghcr.io/rosch100/haos-litellm-litellm
arch:
  - aarch64
init: false
startup: services
ports:
  4000/tcp: null
ports_description:
  4000/tcp: LiteLLM API; leave unpublished and configure a trusted reverse proxy if external access is required
options:
  database_url: null
  master_key: null
  config_file: /config/litellm.yaml
  environment_variables: []
schema:
  database_url: password
  master_key: password
  salt_key: password?
  config_file: str
  environment_variables:
    - name: str
      value: password
map:
  - app_config:ro
