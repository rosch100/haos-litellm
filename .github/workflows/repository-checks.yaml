name: Home Assistant repository checks

on:
  push:
    branches:
      - "**"
    paths:
      - "repository.yaml"
      - "litellm/config.yaml"
      - "litellm/Dockerfile"
      - "litellm/*.sh"
      - "litellm/**/*.sh"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "repository.yaml"
      - "litellm/config.yaml"
      - "litellm/Dockerfile"
      - "litellm/*.sh"
      - "litellm/**/*.sh"
      - ".github/workflows/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-repository:
    name: Validate Home Assistant repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.x"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate Home Assistant repository metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          repository = yaml.safe_load(Path("repository.yaml").read_text(encoding="utf-8"))
          if not isinstance(repository, dict):
              raise SystemExit("repository.yaml must contain a YAML mapping")
          if not isinstance(repository.get("name"), str) or not repository["name"].strip():
              raise SystemExit("repository.yaml must define a non-empty name")
          app = yaml.safe_load(Path("litellm/config.yaml").read_text(encoding="utf-8"))
          if not isinstance(app, dict):
              raise SystemExit("litellm/config.yaml must contain a YAML mapping")
          if not isinstance(app.get("arch"), list) or not app["arch"]:
              raise SystemExit("litellm/config.yaml must define at least one architecture")
          print("Home Assistant repository and app metadata are valid")
          PY

  lint-workflows:
    name: Check GitHub Actions workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  lint-dockerfile:
    name: Lint Home Assistant Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Home Assistant Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: litellm/Dockerfile

  lint-shell-scripts:
    name: Lint Home Assistant shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint shell scripts with ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: litellm
          additional_files: litellm/run.sh
          severity: error
          format: gcc
