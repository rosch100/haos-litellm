name: LiteLLM App CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "litellm/**"
      - "tests/**"
      - "repository.yaml"
      - ".github/workflows/build.yaml"
  push:
    branches:
      - main
    paths:
      - "litellm/**"
      - "repository.yaml"
      - ".github/workflows/build.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Home Assistant app contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request merge result
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: python -m pip install PyYAML
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Lint Home Assistant app
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./litellm

  build:
    name: Build ARM64 image artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    needs: validate
    steps:
      - name: Check out pull request merge result
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read app metadata
        id: version
        run: |
          version="$(awk -F '"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          arch="$(awk '/^  - / {print $2; exit}' litellm/config.yaml)"
          test -n "$arch"
          {
            echo "value=$version"
            echo "arch=$arch"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image for PR verification
        id: image
        uses: docker/build-push-action@v7.0.0
        with:
          context: ./litellm
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rosch100/haos-litellm-litellm:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=litellm-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=litellm-pr-${{ github.event.pull_request.number }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_ARCH=aarch64
      - name: Record image provenance
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_TREE: ${{ github.sha }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          source_tree="$(git rev-parse "$SOURCE_TREE^{tree}")"
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg source_tree "$source_tree" \
            --arg version "$APP_VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            '{pr_number: $pr_number, pr_head_sha: $pr_head_sha, source_tree: $source_tree, version: $version, digest: $digest}' \
            > "${{ runner.temp }}/litellm-image.json"
      - name: Upload image provenance for post-merge promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: litellm-image-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/litellm-image.json
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Publish tested ARM64 image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
      actions: read
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find the merged pull request and successful image build
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2016
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$MERGE_SHA\") | {number, head_sha: .head.sha, head_branch: .head.ref}" \
            | jq -s '.[0] // empty')"
          test -n "$pull_request"
          pr_number="$(jq -r '.number' <<< "$pull_request")"
          pr_head_sha="$(jq -r '.head_sha' <<< "$pull_request")"
          pr_branch="$(jq -r '.head_branch' <<< "$pull_request")"
          artifact_name="litellm-image-$pr_number-$pr_head_sha"
          run_id=""
          while IFS= read -r candidate; do
            # shellcheck disable=SC2016
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
              --jq --arg name "$artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' || true)"
            if [[ -n "$artifact_id" ]]; then
              run_id="$candidate"
              break
            fi
          done < <(
            gh run list --workflow build.yaml --event pull_request \
              --json databaseId,headSha,conclusion --limit 100 \
              | jq -r --arg sha "$pr_head_sha" \
                '[.[] | select(.headSha == $sha and .conclusion == "success")] | sort_by(.databaseId) | reverse | .[].databaseId'
          )
          test -n "$run_id"
          {
            echo "number=$pr_number"
            echo "head_sha=$pr_head_sha"
            echo "head_branch=$pr_branch"
            echo "run_id=$run_id"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
      - name: Download tested image artifact
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARTIFACT: ${{ steps.run.outputs.artifact_name }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$IMAGE_ARTIFACT" --dir "${{ runner.temp }}/litellm-image"
      - name: Verify image artifact provenance
        id: provenance
        env:
          PR_NUMBER: ${{ steps.run.outputs.number }}
          PR_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          PR_BRANCH: ${{ steps.run.outputs.head_branch }}
          MERGED_SHA: ${{ github.sha }}
          IMAGE_METADATA: ${{ runner.temp }}/litellm-image/litellm-image.json
        run: |
          version="$(awk -F '"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pr_source_tree="$(git rev-parse "$PR_HEAD_SHA^{tree}")"
          git fetch --no-tags origin "$PR_BRANCH"
          if ! git merge-base --is-ancestor "$PR_HEAD_SHA" "$MERGED_SHA"; then
            merged_parent="$(git rev-parse "$MERGED_SHA^1")"
            test "$(git rev-parse "$merged_parent^{tree}")" = "$pr_source_tree"
          fi
          jq -e \
            --arg pr "$PR_NUMBER" \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg source_tree "$pr_source_tree" \
            --arg version "$version" \
            '.pr_number == $pr and .pr_head_sha == $head_sha and .source_tree == $source_tree and .version == $version' \
            "$IMAGE_METADATA" >/dev/null
          digest="$(jq -r '.digest' "$IMAGE_METADATA")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          arch="$(awk '/^  - / {print $2; exit}' litellm/config.yaml)"
          test -n "$arch"
          {
            echo "value=$version"
            echo "digest=$digest"
            echo "arch=$arch"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the PR image with release tags
        env:
          APP_VERSION: ${{ steps.provenance.outputs.value }}
          SOURCE_TAG: ghcr.io/rosch100/haos-litellm-litellm:pr-${{ steps.run.outputs.number }}-${{ steps.run.outputs.head_sha }}
          EXPECTED_DIGEST: ${{ steps.provenance.outputs.digest }}
          BUILD_ARCH: ${{ steps.provenance.outputs.arch }}
        run: |
          docker pull "$SOURCE_TAG"
          registry_digest="$(docker buildx imagetools inspect "$SOURCE_TAG" --format '{{.Digest}}')"
          test "$registry_digest" = "$EXPECTED_DIGEST"
          image_id="$(docker image inspect "$SOURCE_TAG" --format '{{.Id}}')"
          version_tag=ghcr.io/rosch100/haos-litellm-litellm:"$APP_VERSION"
          latest=ghcr.io/rosch100/haos-litellm-litellm:latest
          test "$(docker image inspect "$SOURCE_TAG" --format '{{.Architecture}}')" = "$BUILD_ARCH"
          test "$(docker image inspect "$SOURCE_TAG" --format '{{index .Config.Labels "io.hass.version"}}')" = "$APP_VERSION"
          docker tag "$image_id" "$version_tag"
          docker tag "$image_id" "$latest"
          docker push "$version_tag"
          docker push "$latest"
