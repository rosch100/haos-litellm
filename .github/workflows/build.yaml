name: LiteLLM App CI

on:
  push:
    branches:
      - "**"
    paths:
      - "litellm/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-litellm.yaml"
      - "repository.yaml"
      - ".github/workflows/build.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "litellm/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-litellm.yaml"
      - "repository.yaml"
      - ".github/workflows/build.yaml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Home Assistant app contract
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: python -m pip install PyYAML
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Lint Home Assistant app
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./litellm

  build:
    name: Build ARM64 image once on branch
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.repository == 'rosch100/haos-litellm'
    runs-on: ubuntu-24.04-arm
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out branch source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read app metadata
        id: metadata
        run: |
          version="$(awk -F '"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable branch image
        id: image
        uses: docker/build-push-action@v7.0.0
        with:
          context: ./litellm
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rosch100/haos-litellm-litellm:sha-${{ github.sha }}
          cache-from: type=gha,scope=litellm-main
          cache-to: type=gha,mode=max,scope=litellm-main
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_ARCH=aarch64
      - name: Record image digest provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg image "ghcr.io/rosch100/haos-litellm-litellm" \
            --arg version "$VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            '{source_sha: $source_sha, image: $image, version: $version, digest: $digest}' \
            > "$RUNNER_TEMP/litellm-image.json"
          echo "Built ghcr.io/rosch100/haos-litellm-litellm:sha-${GITHUB_SHA} at ${IMAGE_DIGEST}"
      - name: Preserve digest provenance for promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: litellm-image-${{ github.sha }}
          path: ${{ runner.temp }}/litellm-image.json
          if-no-files-found: error
          retention-days: 7

  build-fork-pr:
    name: Build ARM64 image for fork pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04-arm
    needs: validate
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read app metadata
        id: metadata
        run: |
          version="$(awk -F '\"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          [[ "$version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v7.0.0
        with:
          context: ./litellm
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=litellm-fork-pr
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_ARCH=aarch64

  verify-branch-image:
    name: Verify successful branch image build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 60
    steps:
      - name: Wait for the matching branch image build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          for _ in {1..210}; do
            while IFS=$'\t' read -r run_id status conclusion; do
              if [[ "$status" == completed && "$conclusion" == success ]]; then
                artifact_name="litellm-image-$PR_HEAD_SHA"
                artifact_id="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id/artifacts" \
                  --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id")"
                if [[ -n "$artifact_id" ]]; then
                  exit 0
                fi
              fi
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "The branch image build for $PR_HEAD_SHA ended with $conclusion" >&2
                exit 1
              fi
            done < <(
              gh run list --repo "$SOURCE_REPOSITORY" --workflow build.yaml --event push --branch "$PR_BRANCH" \
                --json databaseId,headSha,status,conclusion --limit 100 \
                | jq -r --arg sha "$PR_HEAD_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | reverse | .[] | [.databaseId, .status, (.conclusion // "")] | @tsv'
            )
            sleep 10
          done
          echo "No successful branch image build with provenance found for $PR_HEAD_SHA" >&2
          exit 1

  promote:
    name: Promote branch image on main without rebuilding
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rosch100/haos-litellm'
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.source.outputs.promoted }}
    permissions:
      contents: read
      pull-requests: read
      packages: write
      actions: read
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up GitHub CLI
        run: sudo apt-get update && sudo apt-get install --yes gh jq
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the merged pull request and successful image build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pull_request="$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$MERGE_SHA\") | {number, head_sha: .head.sha, head_branch: .head.ref, head_repository: .head.repo.full_name}" \
            | jq -s ".[0] // empty")"
          if [[ -z "$pull_request" ]]; then
            echo "No merged pull request found for $MERGE_SHA; direct pushes to main are not promoted here."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          pr_number="$(jq -r ".number" <<< "$pull_request")"
          pr_head_sha="$(jq -r ".head_sha" <<< "$pull_request")"
          pr_branch="$(jq -r ".head_branch" <<< "$pull_request")"
          pr_repository="$(jq -r ".head_repository" <<< "$pull_request")"
          test "$pr_repository" = "$REPOSITORY"
          run_id="$(gh run list --repo "$REPOSITORY" --workflow build.yaml --event push --branch "$pr_branch" \
            --json databaseId,headSha,conclusion --limit 100 \
            | jq -r --arg sha "$pr_head_sha" '[.[] | select(.headSha == $sha and .conclusion == "success")] | sort_by(.databaseId) | reverse | .[0].databaseId // empty')"
          test -n "$run_id"
          built_sha="$(gh run view "$run_id" --repo "$REPOSITORY" --json headSha --jq .headSha)"
          test "$built_sha" = "$pr_head_sha"
          gh run view "$run_id" --repo "$REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "Build ARM64 image once on branch") | .conclusion' | rg -q '^success$'
          artifact_name="litellm-image-$pr_head_sha"
          artifact_id="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id")"
          test -n "$artifact_id"
          {
            echo "number=$pr_number"
            echo "head_sha=$pr_head_sha"
            echo "run_id=$run_id"
            echo "artifact_id=$artifact_id"
          } >> "$GITHUB_OUTPUT"
      - name: Download image digest provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/litellm-image"
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/litellm-image.zip"
          unzip -q "$RUNNER_TEMP/litellm-image.zip" -d "$RUNNER_TEMP/litellm-image"
      - name: Read app version
        id: version
        run: |
          version="$(awk -F '"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Verify image digest provenance
        id: image
        env:
          PR_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          IMAGE_METADATA: ${{ runner.temp }}/litellm-image/litellm-image.json
        run: |
          jq -e \
            --arg source_sha "$PR_HEAD_SHA" \
            --arg image "ghcr.io/rosch100/haos-litellm-litellm" \
            --arg version "$APP_VERSION" \
            '.source_sha == $source_sha and .image == $image and .version == $version' \
            "$IMAGE_METADATA" >/dev/null
          digest="$(jq -r '.digest' "$IMAGE_METADATA")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Retag the exact branch image as version and latest
        env:
          SOURCE_IMAGE: ghcr.io/rosch100/haos-litellm-litellm
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION_TAG: ghcr.io/rosch100/haos-litellm-litellm:${{ steps.version.outputs.value }}
          LATEST_TAG: ghcr.io/rosch100/haos-litellm-litellm:latest
        run: docker buildx imagetools create --tag "$VERSION_TAG" --tag "$LATEST_TAG" "$SOURCE_IMAGE@$SOURCE_DIGEST"

  release:
    name: Publish GitHub release after image promotion
    if: needs.promote.outputs.promoted == 'true'
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read synchronized LiteLLM release metadata
        id: metadata
        run: |
          version="$(awk -F '"' '/^version:/ {print $2; exit}' litellm/config.yaml)"
          litellm_version="$(awk -F '"' '/^EXPECTED_LITELLM_VERSION =/ {print $2; exit}' litellm/run.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$litellm_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_id="$(gh api "repos/$REPOSITORY/releases/tags/$VERSION" --jq .id 2>/dev/null || true)"
          if [[ -n "$release_id" ]]; then
            echo "GitHub release $VERSION already exists"
            exit 0
          fi
          gh api "repos/$REPOSITORY/releases" \
            --method POST \
            --field "tag_name=$VERSION" \
            --field "target_commitish=$GITHUB_SHA" \
            --field "name=LiteLLM $VERSION" \
            --field generate_release_notes=true
