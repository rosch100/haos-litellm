name: Audit GitHub Actions security

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yaml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yaml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.x"
      - name: Install zizmor
        run: python -m pip install zizmor==1.30.1
      - name: Audit GitHub Actions workflows
        run: zizmor --format=github .
